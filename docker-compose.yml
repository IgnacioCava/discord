version: '3.9'

services:
  redis:
    image: redis:7
    container_name: discord-redis
    ports:
      - ":6379" # Omit host port since the dockerized version doesn't need it
    volumes:
      - redis-data:/data
    networks:
      - discord-net

  nginx:
    image: nginx:stable
    container_name: discord-nginx
    # dev
    ports: 
      - "127.0.0.1:443:443"
      - "127.0.0.1:80:80"
    # prod
    # ports:  
    #   - "443:443"
    #   - "80:80"
    volumes:
      - ./server/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./server/nginx/mime.types:/etc/nginx/mime.types
      - ./server/nginx/conf.d:/etc/nginx/conf.d
      - ./server/certs:/etc/nginx/certs
    depends_on:
      - discord-server
      - discord-worker
    restart: unless-stopped
    networks:
      - discord-net
    
  discord-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: discord-server
    # volumes:
    #   - ./server:/app
    environment:
      - SERVER_ROLE=primary
      - CLUSTER_MODE=external
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - WORKER_COUNT=2
    depends_on:
      - redis
    ports:
      - "5000:5000"
    # for production
    # expose: 
    #   - "5000"
    command: ["./docker-entrypoint.sh"]
    networks:
      - discord-net

  discord-worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      #- NODE_ENV=production
      - SERVER_ROLE=worker
      - CLUSTER_MODE=external
      - REDIS_URL=redis://redis:6379
      - PORT=5000
    volumes:
      - ./server/certs:/app/certs
    depends_on:
      - redis
    networks:
      - discord-net
    expose:
     - "5000"
    # healthcheck:
    #   test: curl -f http://localhost:5000/health || exit 1
    #   interval: 5s
    #   timeout: 4s
    #   retries: 5
    #   start_period: 5s
    # deploy:
    #   replicas: 4  # workers only for Docker Swarm, gets ignored by compose
    #   restart_policy:
    #     condition: on-failure

volumes:
  redis-data:


networks:
  discord-net:
    driver: bridge


